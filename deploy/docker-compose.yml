# One box: the MCP server plus Caddy for HTTPS. Set MCP_DOMAIN and KEPLER_SALT in deploy/.env (not committed).
services:
  mcp:
    build: ..
    restart: unless-stopped
    environment:
      KEPLER_HOSTS: ${MCP_DOMAIN}
      KEPLER_SALT: ${KEPLER_SALT}
      KEPLER_LIGHT_PER_HOUR: "60"
      KEPLER_HEAVY_PER_HOUR: "5"
      KEPLER_CONCURRENCY: "4"
      KEPLER_JOB_WORKERS: "2"
    volumes:
      - mcpdata:/app/data
    mem_limit: 3g
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [mcp]
volumes:
  mcpdata:
  caddydata:
