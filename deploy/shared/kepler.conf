# nginx server blocks for Kepler, for ~/reverse-proxy/nginx/ on the shared box (nginx_proxy container).
# Only Cloudflare may reach it: the server's rate limiter trusts CF-Connecting-IP, which only Cloudflare can then set.
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (2026-11-13).

geo $kepler_cf {
    default 0;
    173.245.48.0/20 1; 103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1; 141.101.64.0/18 1;
    108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1; 197.234.240.0/22 1; 198.41.128.0/17 1;
    162.158.0.0/15 1; 104.16.0.0/13 1; 104.24.0.0/14 1; 172.64.0.0/13 1; 131.0.72.0/22 1;
    2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1; 2405:8100::/32 1;
    2a06:98c0::/29 1; 2c0f:f248::/32 1;
}

server {
    listen 80;
    server_name kepler.genexperiences.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# KEPLER_HTTPS_BEGIN (enabled once the certificate exists)
server {
    listen 443 ssl;
    server_name kepler.genexperiences.com;

    ssl_certificate /etc/letsencrypt/live/kepler.genexperiences.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kepler.genexperiences.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        if ($kepler_cf = 0) { return 403; }
        proxy_pass http://172.17.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;              # MCP streams responses
        proxy_read_timeout 95s;           # server caps calls at 85 s; Cloudflare cuts at 100 s
        proxy_send_timeout 95s;
    }
}
# KEPLER_HTTPS_END
