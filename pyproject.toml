[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tess-hunt-mcp"
version = "0.1.0"
description = "MCP server for finding and vetting transiting planet candidates in TESS full-frame images"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3", "uvicorn", "anyio",
  "numpy<2.5", "pandas", "scipy", "matplotlib", "astropy", "lightkurve>=2.5",
  "astrocut>=1.0", "s3fs", "fsspec", "astroquery", "tess-point", "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tesshunt-mcp = "tesshunt_mcp.server:main"

[tool.setuptools]
packages = ["tesshunt", "tesshunt_mcp"]

[tool.setuptools.package-data]
tesshunt_mcp = ["guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
